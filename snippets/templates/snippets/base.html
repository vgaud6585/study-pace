{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Study Place{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'snippets/css/style.css' %}">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <a href="{% url 'home' %}" class="logo">
            <span class="logo-icon">&lt;/&gt;</span>
            Study Place
        </a>

        <p class="menu-label">MENU</p>

        <nav>
            <a href="{% url 'home' %}" class="nav-link">
                <span>⌂</span> Dashboard
            </a>

            <a href="{% url 'create_snippet' %}" class="nav-link">
                <span>＋</span> Add New Code
            </a>
        </nav>

        <div class="sidebar-bottom">
            <p>Save. Learn. Revise.</p>
            <small>Your personal code library</small>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <p class="topbar-small">YOUR PERSONAL LIBRARY</p>
                <h2>{% block heading %}Dashboard{% endblock %}</h2>
            </div>

            <a href="{% url 'create_snippet' %}" class="btn btn-primary">
                + Add Code
            </a>
        </header>

        <section class="page-content">
            {% block content %}{% endblock %}
        </section>

    </main>

</div>

<script src="{% static 'snippets/js/main.js' %}"></script>
</body>
</html>
